[mcp_servers.glider]
command = "glider"
args = ["--default-timeout", "30m"]
startup_timeout_sec = 30
tool_timeout_sec = 1200

[mcp_servers."glider-trace"]
command = "glider-trace"
args = ["--default-timeout", "30m"]
startup_timeout_sec = 30
tool_timeout_sec = 1200

[mcp_servers.tglider]
command = "npx"
args = ["-y", "tglider", "--default-timeout", "30m"]
startup_timeout_sec = 30
tool_timeout_sec = 1200
